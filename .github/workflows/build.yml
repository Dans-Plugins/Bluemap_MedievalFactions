name: Build

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Fetch the MedievalFactions API jar
        # The pom takes MedievalFactions as a system-scoped dependency from
        # libs/, which is gitignored, so a fresh checkout cannot build. Pull
        # MedievalFactions' rolling dev build and stage it under the name the
        # pom expects. See CONTRIBUTING.md for the local equivalent.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p libs
          gh release download dev -R Dans-Plugins/Medieval-Factions \
            -D libs -p '*-all.jar' --clobber
          mv libs/medieval-factions-*-all.jar libs/medieval-factions-6.0.0-live-all.jar

      - name: Build with Maven
        run: mvn clean package

      # Every Bukkit class, field and method the jar uses must exist on each Minecraft
      # version in minecraft-versions.json, and its bytecode must fit the Java each runs on.
      # See https://github.com/Dans-Plugins/release-gates#api-compatibility-check
      - name: Check Bukkit API use against every supported Minecraft version
        run: |
          curl -fsSL -o /tmp/check_api_compat.py \
            https://raw.githubusercontent.com/Dans-Plugins/release-gates/v12/gates/check_api_compat.py
          python3 /tmp/check_api_compat.py --versions minecraft-versions.json target build/libs
