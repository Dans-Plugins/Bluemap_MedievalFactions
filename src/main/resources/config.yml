# MF_Bluemap Configuration

bluemap:
  # Y-level to render the claim overlay
  y-level: 70.0
  # Format for the claim label
  label-format: "Faction: %faction%"

# Faction Color Configuration
# Applied to factions with no entry under 'factions:' below.
default-color:
  # How such a faction is coloured:
  #   auto  - use the faction's own colour flag in Medieval Factions, falling back
  #           to a colour derived from its faction ID when that flag is unset or is
  #           still the literal "random" placeholder. Each faction is distinct.
  #   fixed - use the fill-color and line-color below for every such faction.
  # Any other value is treated as auto.
  mode: auto
  # Only used when mode is 'fixed'.
  fill-color: "#FFFFFF"
  fill-opacity: 0.35
  # Only used when mode is 'fixed'.
  line-color: "#209cee"
  line-opacity: 1.0

# Optional: Override colors for specific factions by name
# These colors correspond to the 'factions' settings requested (previously SECTOR)
factions:
  # Example:
  # ExampleFaction:
  #   fillColor: "#FF0000"
  #   fillOpacity: 0.35
  #   lineColor: "#FF0000"
  #   lineOpacity: 1.0
